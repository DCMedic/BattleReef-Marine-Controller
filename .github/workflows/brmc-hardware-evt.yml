name: BRMC Hardware EVT CI

on:
  push:
    branches:
      - hardware/brmc-consumer-evt-v1.0-fab
    paths:
      - 'hardware/consumer/evt-v1.0-fab/**'
      - '.github/workflows/brmc-hardware-evt.yml'
  workflow_dispatch:

jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate KiCad project
        run: |
          python3 -m pip install --disable-pip-version-check reportlab==4.4.9
          python3 hardware/consumer/evt-v1.0-fab/generate_brmc_evt.py
          python3 hardware/consumer/evt-v1.0-fab/generate_engineering_review_package.py
          python3 hardware/consumer/evt-v1.0-fab/validate_brmc_evt.py
          git diff --exit-code -- \
            hardware/consumer/evt-v1.0-fab/BRMC_Consumer_EVT_Backplane_v1.0.kicad_pcb \
            hardware/consumer/evt-v1.0-fab/BRMC_Consumer_EVT_Backplane_v1.0.kicad_pro \
            hardware/consumer/evt-v1.0-fab/BRMC_Consumer_EVT_Backplane_v1.0.kicad_dru \
            hardware/consumer/evt-v1.0-fab/BRMC_Consumer_EVT_Backplane_v1.0_Pinout.csv \
            hardware/consumer/evt-v1.0-fab/BRMC_Consumer_EVT_Backplane_v1.0_Netlist.csv \
            hardware/consumer/evt-v1.0-fab/BRMC_Consumer_v1.0_CM5_Carrier_Harness_and_Load_Schedule.md \
            hardware/consumer/evt-v1.0-fab/BRMC_Consumer_v1.0_CM5_Carrier_Harness_and_Load_Schedule.csv \
            hardware/consumer/evt-v1.0-fab/BRMC_Consumer_v1.0_Power_Budget.csv \
            hardware/consumer/evt-v1.0-fab/BRMC_Consumer_v1.0_Connector_and_Harness_Schedule.csv \
            hardware/consumer/evt-v1.0-fab/BRMC_Consumer_v1.0_Engineer_Review_Index.md \
            hardware/consumer/evt-v1.0-fab/connector-production-verification.csv
      - name: Install KiCad
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y kicad
          kicad-cli version
      - name: Prepare and fill fabrication source
        run: |
          FAB=hardware/consumer/evt-v1.0-fab/fab
          SRC=hardware/consumer/evt-v1.0-fab
          STEM=BRMC_Consumer_EVT_Backplane_v1.0
          mkdir -p "$FAB"
          cp "$SRC/$STEM.kicad_pcb" "$FAB/$STEM.kicad_pcb"
          cp "$SRC/$STEM.kicad_pro" "$FAB/$STEM.kicad_pro"
          cp "$SRC/$STEM.kicad_dru" "$FAB/$STEM.kicad_dru"
          cp "$SRC/generate_brmc_evt.py" "$FAB/generate_brmc_evt.py"
          cp "$SRC/generate_engineering_review_package.py" "$FAB/generate_engineering_review_package.py"
          cp "$SRC/validate_brmc_evt.py" "$FAB/validate_brmc_evt.py"
          cp "$SRC/${STEM}_Pinout.csv" "$FAB/${STEM}_Pinout.csv"
          cp "$SRC/README.md" "$FAB/README.md"
          cp "$SRC/release-status.json" "$FAB/release-status.json"
          cp "$SRC/release-gate-evidence.json" "$FAB/release-gate-evidence.json"
          cp "$SRC/EXTERNAL_GATE_HANDOFF.md" "$FAB/EXTERNAL_GATE_HANDOFF.md"
          cp "$SRC/fabricator-stackup-dfm-request.csv" "$FAB/fabricator-stackup-dfm-request.csv"
          cp "$SRC/connector-production-verification.csv" "$FAB/connector-production-verification.csv"
          cp "$SRC/CONNECTOR_PRECHECK.md" "$FAB/CONNECTOR_PRECHECK.md"
          cp "$SRC/independent-review-checklist.csv" "$FAB/independent-review-checklist.csv"
          cp "$SRC/BRMC_Consumer_v1.0_Enclosure_Base_Mounting_Verification.md" "$FAB/BRMC_Consumer_v1.0_Enclosure_Base_Mounting_Verification.md"
          cp "$SRC/BRMC_Consumer_v1.0_Enclosure_Base_6Boss_CNC6061_RELEASE_CANDIDATE.step" "$FAB/BRMC_Consumer_v1.0_Enclosure_Base_6Boss_CNC6061_RELEASE_CANDIDATE.step"
          cp "$SRC/BRMC_Consumer_v1.0_Enclosure_Base_6Boss_CNC6061_RELEASE_CANDIDATE_Drawing.pdf" "$FAB/BRMC_Consumer_v1.0_Enclosure_Base_6Boss_CNC6061_RELEASE_CANDIDATE_Drawing.pdf"
          cp "$SRC/BRMC_Consumer_v1.0_Enclosure_Base_6Boss_CNC6061_RELEASE_CANDIDATE_dimensions.csv" "$FAB/BRMC_Consumer_v1.0_Enclosure_Base_6Boss_CNC6061_RELEASE_CANDIDATE_dimensions.csv"
          cp "$SRC/BRMC_Consumer_v1.0_Enclosure_Base_6Boss_CNC6061_RELEASE_CANDIDATE_interference.csv" "$FAB/BRMC_Consumer_v1.0_Enclosure_Base_6Boss_CNC6061_RELEASE_CANDIDATE_interference.csv"
          cp "$SRC/BRMC_Consumer_v1.0_CM5_Carrier_Harness_and_Load_Schedule.md" "$FAB/BRMC_Consumer_v1.0_CM5_Carrier_Harness_and_Load_Schedule.md"
          cp "$SRC/BRMC_Consumer_v1.0_CM5_Carrier_Harness_and_Load_Schedule.csv" "$FAB/BRMC_Consumer_v1.0_CM5_Carrier_Harness_and_Load_Schedule.csv"
          cp "$SRC/BRMC_Consumer_v1.0_Power_Budget.csv" "$FAB/BRMC_Consumer_v1.0_Power_Budget.csv"
          cp "$SRC/BRMC_Consumer_v1.0_Connector_and_Harness_Schedule.csv" "$FAB/BRMC_Consumer_v1.0_Connector_and_Harness_Schedule.csv"
          cp "$SRC/${STEM}_Netlist.csv" "$FAB/${STEM}_Netlist.csv"
          cp "$SRC/${STEM}_Interconnect_Schematic.pdf" "$FAB/${STEM}_Interconnect_Schematic.pdf"
          cp "$SRC/BRMC_Consumer_v1.0_Electrical_Engineering_Review_Package.pdf" "$FAB/BRMC_Consumer_v1.0_Electrical_Engineering_Review_Package.pdf"
          cp "$SRC/BRMC_Consumer_v1.0_Engineer_Review_Index.md" "$FAB/BRMC_Consumer_v1.0_Engineer_Review_Index.md"
          python3 - <<'PY'
          from pathlib import Path
          import pcbnew

          board_path = Path("hardware/consumer/evt-v1.0-fab/fab/BRMC_Consumer_EVT_Backplane_v1.0.kicad_pcb")
          board = pcbnew.LoadBoard(str(board_path))
          pcbnew.ZONE_FILLER(board).Fill(board.Zones())
          pcbnew.SaveBoard(str(board_path), board)
          PY
      - name: Validate PCB
        run: |
          set +e
          kicad-cli pcb drc --severity-all --exit-code-violations \
            -o hardware/consumer/evt-v1.0-fab/fab/BRMC_Consumer_EVT_Backplane_v1.0_DRC.rpt \
            hardware/consumer/evt-v1.0-fab/fab/BRMC_Consumer_EVT_Backplane_v1.0.kicad_pcb
          rc=$?
          cat hardware/consumer/evt-v1.0-fab/fab/BRMC_Consumer_EVT_Backplane_v1.0_DRC.rpt || true
          exit $rc
      - name: Export fabrication files
        run: |
          FAB=hardware/consumer/evt-v1.0-fab/fab
          PCB="$FAB/BRMC_Consumer_EVT_Backplane_v1.0.kicad_pcb"
          mkdir -p "$FAB/gerbers" "$FAB/drill"
          kicad-cli pcb export gerbers -o "$FAB/gerbers" "$PCB"
          kicad-cli pcb export drill --excellon-separate-th -o "$FAB/drill" "$PCB"
          kicad-cli pcb export pos --format csv --units mm -o "$FAB/BRMC_Consumer_EVT_Backplane_v1.0_positions.csv" "$PCB"
          kicad-cli pcb export ipcd356 -o "$FAB/BRMC_Consumer_EVT_Backplane_v1.0.ipc" "$PCB"
          kicad-cli pcb export step --board-only --include-tracks --include-pads --include-inner-copper \
            -o "$FAB/BRMC_Consumer_EVT_Backplane_v1.0.step" "$PCB"
      - name: Validate fabrication package
        run: |
          FAB=hardware/consumer/evt-v1.0-fab/fab
          (
            cd "$FAB"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          python3 hardware/consumer/evt-v1.0-fab/validate_brmc_evt.py --fab "$FAB"
      - uses: actions/upload-artifact@v4
        with:
          name: BRMC-Consumer-EVT-v1.0-Fabrication
          path: hardware/consumer/evt-v1.0-fab/fab/
          if-no-files-found: error
