# Backend control-plane identity.
user battlereef-backend
topic read battlereef/telemetry/#
topic read battlereef/ack/#
topic write battlereef/cmd/#

# Development aggregate telemetry simulator.
user simulator_node
topic write battlereef/telemetry/simulator_node/#

# Development aggregate device simulator.
user device-simulator
topic read battlereef/cmd/#
topic write battlereef/ack/#

# Production node/device pattern: certificate CN must equal the node/device key.
# A device may read only its own command topic and publish only its own ACK topic.
pattern read battlereef/cmd/%u
pattern write battlereef/ack/%u

# A sensor node may publish telemetry only beneath its own identity namespace.
pattern write battlereef/telemetry/%u/#
