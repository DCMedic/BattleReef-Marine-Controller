services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: battlereef-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - battlereef_postgres_data:/var/lib/postgresql/data
      - ./ops/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: battlereef-mosquitto
    restart: unless-stopped
    ports:
      - "8883:8883"
    volumes:
      - ./ops/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./ops/mosquitto/acl.conf:/mosquitto/config/acl.conf:ro
      - ./ops/mosquitto/certs/ca.crt:/mosquitto/certs/ca.crt:ro
      - ./ops/mosquitto/certs/server.crt:/mosquitto/certs/server.crt:ro
      - ./ops/mosquitto/certs/server.key:/mosquitto/certs/server.key:ro
      - ./ops/mosquitto/certs/broker-health.crt:/mosquitto/certs/broker-health.crt:ro
      - ./ops/mosquitto/certs/broker-health.key:/mosquitto/certs/broker-health.key:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_pub -h localhost -p 8883 --cafile /mosquitto/certs/ca.crt --cert /mosquitto/certs/broker-health.crt --key /mosquitto/certs/broker-health.key -t battlereef/health/broker -m ok -q 1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: python:3.12-slim
    container_name: battlereef-backend
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./shared:/shared
      - ./ops/mosquitto/certs/ca.crt:/run/battlereef-mqtt/ca.crt:ro
      - ./ops/mosquitto/certs/battlereef-backend.crt:/run/battlereef-mqtt/battlereef-backend.crt:ro
      - ./ops/mosquitto/certs/battlereef-backend.key:/run/battlereef-mqtt/battlereef-backend.key:ro
    command:
      - sh
      - -c
      - |
          pip install --upgrade pip && \
          pip install -e . && \
          uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy

  simulator:
    build:
      context: .
      dockerfile: tools/simulator/Dockerfile
    container_name: battlereef-simulator
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 8883
      MQTT_CLIENT_ID: simulator_node
      MQTT_IDENTITY: simulator_node
      MQTT_CA_CERT: /run/battlereef-mqtt/ca.crt
      MQTT_CLIENT_CERT: /run/battlereef-mqtt/simulator_node.crt
      MQTT_CLIENT_KEY: /run/battlereef-mqtt/simulator_node.key
      PUBLISH_INTERVAL_SECONDS: 5
    volumes:
      - ./ops/mosquitto/certs/ca.crt:/run/battlereef-mqtt/ca.crt:ro
      - ./ops/mosquitto/certs/simulator_node.crt:/run/battlereef-mqtt/simulator_node.crt:ro
      - ./ops/mosquitto/certs/simulator_node.key:/run/battlereef-mqtt/simulator_node.key:ro
    command: ["python", "/app/publish_telemetry.py"]
    depends_on:
      mosquitto:
        condition: service_healthy

  device-listener:
    build:
      context: .
      dockerfile: tools/simulator/Dockerfile
    container_name: battlereef-device-listener
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 8883
      MQTT_CLIENT_ID: device-simulator
      MQTT_IDENTITY: device-simulator
      MQTT_CA_CERT: /run/battlereef-mqtt/ca.crt
      MQTT_CLIENT_CERT: /run/battlereef-mqtt/device-simulator.crt
      MQTT_CLIENT_KEY: /run/battlereef-mqtt/device-simulator.key
    volumes:
      - ./ops/mosquitto/certs/ca.crt:/run/battlereef-mqtt/ca.crt:ro
      - ./ops/mosquitto/certs/device-simulator.crt:/run/battlereef-mqtt/device-simulator.crt:ro
      - ./ops/mosquitto/certs/device-simulator.key:/run/battlereef-mqtt/device-simulator.key:ro
    command: ["python", "/app/device_command_listener.py"]
    depends_on:
      mosquitto:
        condition: service_healthy

volumes:
  battlereef_postgres_data:
